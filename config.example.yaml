# Copy to config.yaml and edit. config.yaml is git-ignored.
#
# Passwords are NOT stored here. Each student gets their own persistent browser
# profile under data/profiles/<slug>/. You log in once with `school-planner login <slug>`
# and the session is reused after that.

timezone: America/New_York
classlink_url: https://myapps.classlink.com/home

# How to reach Claude.
#   claude-code  uses the `claude` command and your Claude Code login (default, no API key)
#   api          uses the Anthropic API with ANTHROPIC_API_KEY from .env
backend: claude-code
# Model: an alias (opus, sonnet, haiku) for claude-code, or a full id like claude-opus-5 for api.
model: opus

students:
  - name: Kid One
    slug: kid1
    grade: 7
    # Optional. Leave apps empty and run `school-planner discover kid1` to find them.
    apps:
      # Browser-based Canvas sync (full: submission status, module notes). Needs `login` once.
      # canvas: https://yourdistrict.instructure.com
      # Canvas private calendar feed (no login, works from anywhere). Canvas Calendar page,
      # "Calendar Feed" link at the bottom right, copy the URL ending in .ics.
      # canvas_feed: https://yourdistrict.instructure.com/feeds/calendars/user_XXXXXXXX.ics
      # google_classroom: https://classroom.google.com
  - name: Kid Two
    slug: kid2
    grade: 4
    apps: {}

schedule:
  # How many days ahead to look for tests when planning study sessions.
  lookahead_days: 14
  # Study sessions inserted before each test/quiz, in days before the due date.
  study_days_before: [4, 2, 1]
  # Minutes per study session shown on the schedule.
  study_session_minutes: 30
