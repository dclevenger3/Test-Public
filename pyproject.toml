[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-planner"
version = "0.1.0"
description = "Weekly schedule, test tracker, and study-guide generator for kids' school accounts behind ClassLink"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.6.0",
    "playwright>=1.50",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
school-planner = "school_planner.cli:main"

[tool.setuptools.packages.find]
include = ["school_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
